name: Mise à jour nocturne et mise en ligne

on:
  schedule:
    - cron: "17 3 * * *"        # chaque nuit à 03:17 UTC (04:17 à Paris en hiver)
  workflow_dispatch:             # bouton « Run workflow » pour lancer à la main
    inputs:
      only:
        description: "Tester seulement ces sources (identifiants séparés par des virgules, vide = toutes)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boussole
  cancel-in-progress: false

jobs:
  collecte:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Collecter les offres
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ONLY: ${{ github.event.inputs.only }}
        run: python collector/collect.py
      - name: Enregistrer les nouvelles offres
        run: |
          git config user.name "boussole-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Mise à jour des offres ($(date -u +%F))"
          git push

  mise-en-ligne:
    needs: collecte
    if: always() && (needs.collecte.result == 'success' || needs.collecte.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
