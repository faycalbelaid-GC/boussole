<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · doctorats, masters et bourses</title>
<meta name="description" content="Offres de doctorat, master, postdoc et bourses dans le monde entier, mises à jour chaque nuit. Suivez vos candidatures, vos dates limites et préparez vos documents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: posé, précis, un peu chaleureux — le carnet de route d'un étudiant qui part
   IDEA: un carnet de voyage : la route en 5 étapes, des dates tamponnées comme des visas
   PICTURE: la route dessinée de l'accueil + le tampon compte à rebours « J-14 » sur chaque offre
   COLOUR and TYPE: gris encre neutres, un accent encre de tampon (vermillon) rare ; Instrument Sans + Geist Mono
   LAYOUT: menu 248 px calme, contenu fluide 1440 max, grille de 4 px, empilé sous 820 px
   Passes inspirées de « unslop » par Damir Sokolovsky (@heydamir), CC BY 4.0 */
:root{color-scheme:light dark;
--bg:light-dark(#f5f7fa,#0b0d14);--side:light-dark(#eef1f5,#07080d);--card:light-dark(#ffffff,#11141c);--raised:light-dark(#eceff4,#1a1e28);
--ink:light-dark(#111827,#eef0f5);--ink2:light-dark(#4b5565,#a3a9b8);--mut:light-dark(#6b7487,#7a8296);
--line:light-dark(rgba(17,24,39,.09),rgba(238,240,245,.09));--line2:light-dark(rgba(17,24,39,.16),rgba(238,240,245,.16));
--acc:light-dark(#c2410c,#ff8a5c);--accink:light-dark(#ffffff,#1d0c04);--acctext:light-dark(#b13a0a,#ff9b73);--accsoft:light-dark(#fbeee7,#2a1810);
--ok:light-dark(#16a34a,#4cc38a);--bad:light-dark(#dc2626,#e5484d);
--sh:light-dark(0 1px 2px rgba(0,0,0,.05),none);--shf:light-dark(0 8px 24px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.4));
--ease:cubic-bezier(.22,1,.36,1);--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,2.6vw,32px);letter-spacing:-.01em}h2{font-size:18px}h3{font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* navigation */
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;padding:4px 10px 20px}
.brand svg{width:22px;height:22px}
.side a{display:flex;align-items:center;gap:10px;color:var(--ink2);text-decoration:none;padding:0 10px;height:36px;border-radius:8px;font-weight:500;font-size:14px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.side a .ic{color:var(--mut)}
.side a:hover{background:var(--raised);color:var(--ink)}
.side a.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),var(--sh)}
.side a.on .ic{color:var(--acc)}
.side .grp{font-size:12px;color:var(--mut);padding:20px 10px 6px}
.planbox{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);display:grid;gap:8px}
.planbox b{font-weight:500;color:var(--ink)}
main{padding:32px clamp(16px,3vw,40px) 64px;max-width:1440px;width:100%}
main>*{animation:rise .22s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
/* primitives */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--sh)}
.soft{background:var(--raised);border-color:transparent;box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:0 14px;height:36px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--raised)}
.btn:active{transform:scale(.98)}
.btn .ic{color:var(--ink2)}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}.pri:hover{background:var(--acc);filter:brightness(1.06)}
.pri .ic{color:currentColor}
.ghost{border-color:transparent;background:transparent;color:var(--ink2)}.ghost:hover{color:var(--ink)}
.sm{height:32px;padding:0 10px;font-size:13px}
.icon{width:32px;padding:0}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--acctext);font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.mut{color:var(--ink2)}.small{font-size:14px}.tiny{font-size:12px;color:var(--mut)}
.meta{font:12px/16px var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:20px;padding:0 8px;border-radius:6px;background:var(--raised);color:var(--ink2);white-space:nowrap}
.tag.a{background:var(--accsoft);color:var(--acctext)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mut);flex:none}
/* signature : tampon compte à rebours */
.stamp{display:inline-flex;align-items:center;font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;padding:4px 6px;border:1px solid var(--line2);border-radius:4px;color:var(--ink2);white-space:nowrap;letter-spacing:.02em}
.stamp.hot{border-color:var(--acc);color:var(--acctext);transform:rotate(-2deg)}
.stamp.off{color:var(--mut);border-style:dashed}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:0 12px;height:36px;width:100%;font-size:14px;transition:border-color .15s var(--ease)}
input:hover,select:hover,textarea:hover{border-color:var(--mut)}
textarea{height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.5}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--ink2)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
.pagehead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px}
.pagehead p{margin:8px 0 0;color:var(--ink2)}
.section{margin-top:40px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sechead h2{flex:1}
/* route (moment) */
.route{position:relative;padding:8px 0 0;margin:0 0 24px;overflow-x:auto}
.route svg{display:block;width:100%;min-width:640px;height:auto}
.route .lbls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));min-width:640px;text-align:center;gap:8px}
.route .lbls div{font-size:13px;color:var(--ink2);padding:0 4px}
.route .lbls b{display:block;font-weight:500;color:var(--ink);font-size:14px}
.route .lbls .cur b{color:var(--acctext)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:24px}
.next h2{font-size:clamp(20px,2vw,24px);margin:8px 0 6px}
.next .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.chk.done span{text-decoration:line-through;color:var(--mut)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border:0}
.dl button{background:none;border:0;padding:0;text-align:left}
.dl button:hover h3{text-decoration:underline;text-underline-offset:3px}
/* cartes d'offres */
.opp{display:grid;gap:8px;align-content:start;position:relative;transition:border-color .15s var(--ease)}
.opp:hover{border-color:var(--line2)}
.opp .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opp h3{font-size:15px;font-weight:500}
.opp .open{all:unset;cursor:pointer}
.opp .open::after{content:'';position:absolute;inset:0;border-radius:14px}
.opp .open:focus-visible::after{outline:2px solid var(--acc);outline-offset:2px}
.opp .acts{display:flex;gap:4px;align-items:center;margin-top:4px;position:relative;z-index:1}
.opp .fund{font-size:13px;color:var(--ink2)}
.saved{color:var(--acctext)}.saved .ic{fill:currentColor;color:var(--acc)}
.list{display:grid;gap:8px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tool{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px;display:grid;gap:4px;align-content:start;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.tool:hover{border-color:var(--line2);background:var(--raised)}
.tool b{font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.tool b .ic{color:var(--mut)}
.tool span{font-size:13px;color:var(--ink2)}
/* twin */
.twin{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;height:calc(100vh - 96px);min-height:540px}
.chats{display:flex;flex-direction:column;gap:2px;overflow:auto;border-right:1px solid var(--line);padding-right:16px}
.chats .it{display:flex;align-items:center;gap:2px;border-radius:8px;height:36px;padding-right:2px}
.chats .it:hover{background:var(--raised)}
.chats .it.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.chats .it button.t{flex:1;text-align:left;border:0;background:none;padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:36px;color:var(--ink2)}
.chats .it.on button.t{color:var(--ink)}
.chats .it .btn{opacity:0}.chats .it:hover .btn,.chats .it.on .btn,.chats .it .btn:focus-visible{opacity:1}
.conv{display:flex;flex-direction:column;min-height:0;max-width:880px;width:100%}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:4px 4px 16px}
.m{max-width:720px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.m.u{align-self:flex-end;background:var(--raised);padding:10px 14px;border-radius:14px 14px 4px 14px}
.m.a{padding:2px 0}
.m.act{font:12px/16px var(--mono);color:var(--mut);display:flex;gap:8px;align-items:center}
.m.act::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.composer{border:1px solid var(--line2);border-radius:14px;padding:8px;display:grid;gap:4px;background:var(--card);box-shadow:var(--sh)}
.composer textarea{border:0;min-height:56px;padding:8px;resize:none;background:transparent}
.composer textarea:focus{outline:none}
.gauge{width:64px;height:4px;border-radius:4px;background:var(--raised);overflow:hidden}.gauge i{display:block;height:100%;background:var(--ink2)}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);border-radius:8px;padding:0 8px;height:32px;background:transparent}
label.chip{border:1px solid var(--line);cursor:pointer}
label.chip:has(input:checked){border-color:var(--line2);background:var(--raised);color:var(--ink)}
.fileb{position:relative;overflow:hidden}.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* tracker */
.tabs{display:inline-flex;gap:2px;background:var(--raised);padding:2px;border-radius:10px;max-width:100%;overflow-x:auto}
.tabs button,.tabs label{border:0;background:none;border-radius:8px;padding:0 12px;height:32px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;color:var(--ink2);font-weight:500}
.tabs button.on,.tabs label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.tabs label input{position:absolute;opacity:0;pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td select{height:32px;font-size:13px}
tr.sel td{background:var(--raised)}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi b{display:block;font:500 28px/1.1 'Instrument Sans',sans-serif;font-variant-numeric:tabular-nums;margin-top:8px}
/* panneau & fenêtre */
.ov{position:fixed;inset:0;background:rgba(7,8,13,.45);z-index:20;display:none}
.ov.on{display:block;animation:fade .16s var(--ease)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--line);z-index:21;padding:24px;overflow:auto;transform:translateX(104%);transition:transform .22s var(--ease);box-shadow:var(--shf)}
.drawer.on{transform:none}
.drawer p{margin:8px 0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;width:min(640px,calc(100% - 24px));max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;z-index:22;display:none;box-shadow:var(--shf)}
.modal.on{display:block;transform:translate(-50%,-50%);opacity:1;animation:pop .2s var(--ease)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .16s var(--ease),transform .16s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.plans .card{display:grid;gap:12px;align-content:start}
.plans ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink2)}
.price{font:500 28px 'Instrument Sans',sans-serif}
.empty{padding:32px;text-align:center;color:var(--ink2);border:1px dashed var(--line2);border-radius:14px}
.note{font-size:13px;color:var(--mut)}
pre.doc{white-space:pre-wrap;font:14px/1.6 'Instrument Sans',sans-serif;margin:0}
ol#plog{font:12px/20px var(--mono);color:var(--ink2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
legend{font-size:13px;color:var(--ink2);padding:0 4px}
[data-ask],[data-askt],[data-elig],[data-analyze],[data-prospect],[data-runalert],[data-go=twin],.twinbox,.eligsec{display:none!important}
main>h1+p,main>.row:first-child+p{margin:8px 0 24px;color:var(--ink2)}
main>.row:first-child h1{margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
.app{grid-template-columns:1fr}
.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;border-right:0;border-bottom:1px solid var(--line);gap:2px}
.side>*{flex:none}.side .brand{padding:0 8px}.side .grp,.planbox{display:none}
.side a{white-space:nowrap;height:40px}
main{padding:24px 16px 48px}
.twin{grid-template-columns:1fr;height:auto}.chats{border:0;padding:0;max-height:160px}
.next{grid-template-columns:1fr}
.btn{height:40px}.sm{height:36px}
}
@media(max-width:600px){.route svg,.route .lbls{min-width:0}.route .lbls div{font-size:11px;padding:0}.route .lbls b{font-size:12px}.route .lbls .meta{display:none}.dl .tag{display:none}.g2,.g3,.g4{grid-template-columns:1fr}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:4px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mut)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="app">
<nav class="side" id="side" aria-label="Navigation principale"></nav>
<main id="main" tabindex="-1"></main>
</div>
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Détail"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
const addDays=(n,base)=>{const d=base?new Date(base):new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const I=p=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICS={check:I('<path d="M20 6 9 17l-5-5"/>'),x:I('<path d="M18 6 6 18M6 6l12 12"/>'),star:I('<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>'),bookmark:I('<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'),ext:I('<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),clip:I('<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>'),search:I('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),arrow:I('<path d="M5 12h14M13 6l6 6-6 6"/>'),plus:I('<path d="M12 5v14M5 12h14"/>'),send:I('<path d="M12 19V5M5 12l7-7 7 7"/>'),msg:I('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5A8 8 0 1 1 21 12z"/>'),pen:I('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),user:I('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'),list:I('<path d="M4 6h16M4 12h16M4 18h10"/>')};

const IC={home:I('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),twin:I('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'),pos:I('<path d="M3 7h18v13H3zM8 7V4h8v3"/>'),sch:I('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>'),prof:I('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'),trk:I('<path d="M4 6h16M4 12h16M4 18h10"/>'),doc:I('<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/>'),bell:I('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>'),plan:I('<path d="M12 2l3 7h7l-6 4 2 8-6-5-6 5 2-8-6-4h7z"/>'),map:I('<path d="M9 4l6 2 6-2v16l-6 2-6-2-6 2V6z"/><path d="M9 4v16M15 6v16"/>')};

/* ---------- Catalogue réel (prospecté le 24 nov. 2026) + offres trouvées par vos prospections ---------- */

 [2,'Mettre à jour le CV académique',12],[2,lv==='Master'||lv==='Licence'?'Rédiger la lettre de motivation (SOP)':'Rédiger la proposition de recherche',25],[2,'Demander 2 à 3 lettres de recommandation',20],[2,'Traduire et certifier relevés de notes',30],
 [3,'Envoyer les candidatures prioritaires',40],[3,'Préparer l\'entretien (simulations)',50],[3,'Suivre les relances sans réponse',55],
 [4,'Réunir les justificatifs financiers',75],[4,'Déposer la demande de visa',85],[4,'Logement et voyage',100]];
 const keep=new Set(custom.map(t=>t.title));
 S.roadmap=custom.concat(T.filter(t=>!keep.has(t[1])).map(([st,title,d])=>({id:uid(),stage:st,title,due:addDays(d),done:false})));
}
const stageProg=i=>{const t=S.roadmap.filter(x=>x.stage===i);return t.length?t.filter(x=>x.done).length/t.length:0};
const curStage=()=>{for(let i=0;i<5;i++)if(stageProg(i)<1)return i;return 4};
const nextTask=()=>S.roadmap.filter(t=>!t.done).sort((a,b)=>a.stage-b.stage||a.due.localeCompare(b.due))[0];

 return Math.max(0,Math.round(Math.min(P.day-c.dUsed,P.month-c.mUsed)*10)/10)}

function route(){const cs=curStage(),pts=[[100,50],[300,30],[500,54],[700,28],[900,46]];
 let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<5;i++){const [a,b]=pts[i-1],[x,y]=pts[i];d+=` C${a+100} ${b} ${x-100} ${y} ${x} ${y}`}
 const prog=Math.min(1,(cs+stageProg(cs))/4)*100;
 const nodes=pts.map(([x,y],i)=>{const done=stageProg(i)>=1;return i===cs&&!done?`<circle cx="${x}" cy="${y}" r="11" style="fill:var(--card);stroke:var(--acc);stroke-width:2"/><circle cx="${x}" cy="${y}" r="4.5" style="fill:var(--acc)"/>`:done?`<circle cx="${x}" cy="${y}" r="10" style="fill:var(--acc)"/><path d="M${x-4.5} ${y}l3 3 6-6" style="fill:none;stroke:var(--accink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>`:`<circle cx="${x}" cy="${y}" r="7" style="fill:var(--card);stroke:var(--line2);stroke-width:1.5"/>`}).join('');
 return `<div class="route" aria-label="Votre route en 5 étapes"><svg viewBox="0 0 1000 80" role="img" aria-hidden="true"><path d="${d}" pathLength="100" style="fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:1.2 1.2"/><path d="${d}" pathLength="100" style="fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:${prog} 100"/>${nodes}</svg>

let mcp=null;
async function getMcp(){if(mcp)return mcp;try{mcp=await claude.use('mcp')}catch(e){}return mcp}
function hits(p){const out=[];const walk=(x,d)=>{if(x==null||d>8)return;if(typeof x==='string'){if(/^\s*[\[{]/.test(x)){try{walk(JSON.parse(x),d+1)}catch(e){}}return}if(Array.isArray(x)){x.forEach(y=>walk(y,d+1));return}if(typeof x==='object'){if(typeof x.url==='string'&&/^https:\/\//.test(x.url)&&(x.title||x.description)){out.push({title:String(x.title||'').slice(0,200),url:x.url,desc:String(x.description||x.snippet||'').replace(/\s+/g,' ').slice(0,350)})}else Object.values(x).forEach(y=>walk(y,d+1))}};walk(p,0);return out}
async function fcSearch(q,fresh){const m=await getMcp();if(!m)throw{code:'no_mcp'};const r=await m.callTool('Firecrawl','firecrawl_search',{query:q,objective:'Find current funded PhD, master, postdoc positions and scholarships for a student applying abroad',limit:10,sources:['web'],domainTools:false,...(fresh?{tbs:fresh}:{})});return hits(r&&('payload' in r)?r.payload:r)}
function buildQuery(o,pl){const fe=fieldEn(o.field),cs=(o.countries||[]).slice(0,3).map(c=>CEN[c]||c),geo=cs.length?'('+cs.join(' OR ')+')':'';
 const lvl={Licence:'bachelor',Master:'master',PhD:'PhD',Postdoc:'postdoc'}[o.lvl]||'PhD';
 let q=o.k==='scholarship'?`${lvl} scholarship ${fe} ${geo} 2027`:o.k==='professor'?`professor ${fe} research group "PhD students" recruiting ${geo}`:(lvl==='postdoc'?`postdoctoral position ${fe} ${geo}`:lvl==='master'?`master ${fe} funded ${geo}`:`funded ${lvl} position ${fe} ${geo}`);
 if(o.kw)q=o.kw+' '+q;
 if(pl.id==='adum'||pl.id==='abg')q=(o.k==='scholarship'?'bourse ':'offre de thèse financée ')+(o.field||'')+' '+(o.kw||'');
 if(pl.id==='linkedin')q+=' fully funded';
 if(pl.id==='x')q='"'+(o.k==='scholarship'?'scholarship':o.k==='professor'?'PhD students':'fully funded '+lvl)+'" '+fe+(o.kw?' '+o.kw:'');
 if(pl.id==='unis')q+=' site:.edu OR site:.ac.uk OR site:.edu.au OR site:.de OR site:.fr OR site:.nl -site:findaphd.com';
 else if(pl.site)q+=' site:'+pl.site;
 return q.replace(/\s+/g,' ').trim()}
const KW_OK=/ph\.?d|doctor|doctoral|thèse|these|scholarship|bourse|fellowship|studentship|postdoc|master|msc|funded|financ|recruit|position|professor|lab|group/i;
async function normalize(raw,o){const s=await getSample();
 if(!s||credits()<1){return raw.filter(h=>KW_OK.test(h.title+' '+h.desc)).map(h=>({t:h.title.replace(/\s*[|\-–]\s*(LinkedIn|X|Twitter).*$/i,''),u:'',c:'',lvl:o.lvl||'',f:o.field||'',fund:'',dl:'',url:h.url,src:h.src,k:o.k}))}
 const out=[];for(let i=0;i<raw.length;i+=30){const chunk=raw.slice(i,i+30);
  const prompt=`Tu tries des résultats de recherche pour un étudiant qui cherche : ${KLAB[o.k]} · niveau ${o.lvl||'?'} · domaine ${o.field||'?'} · pays ${(o.countries||[]).join(', ')||'tous'} · mots-clés ${o.kw||'aucun'}. Aujourd'hui : ${today()}.
Résultats : ${JSON.stringify(chunk.map((h,j)=>({i:j,title:h.title,url:h.url,desc:h.desc})))}
Pour CHAQUE résultat renvoie un objet. keep=true seulement si c'est une offre/annonce réelle (poste de doctorat, master, postdoc, bourse, ou page d'un professeur/groupe qui recrute) correspondant à la recherche et pas clairement expirée ; false pour actualités, pages hors sujet, publicités, pages génériques sans offre.
Réponds UNIQUEMENT en JSON : [{"i":0,"keep":true,"t":"intitulé court en langue d'origine","u":"établissement","c":"pays en français","lvl":"Licence|Master|PhD|Postdoc","f":"un domaine parmi ${Object.keys(FEN).join(' | ')}","fund":"financement en français court ou vide","dl":"AAAA-MM-JJ ou vide","topics":["thèmes si professeur"]}]. N'invente rien : laisse vide ce qui n'est pas dans le texte.`;
  try{const r=await s.json(prompt,{modelTier:'quick'});spend(1);(Array.isArray(r)?r:(r&&r.items)||[]).forEach(x=>{const h=chunk[x.i];if(h&&x.keep)out.push({t:String(x.t||h.title).slice(0,220),u:String(x.u||''),c:String(x.c||''),lvl:String(x.lvl||''),f:FEN[x.f]?x.f:(o.field||'Pluridisciplinaire'),fund:String(x.fund||''),dl:/^\d{4}-\d\d-\d\d$/.test(x.dl||'')?x.dl:'',topics:Array.isArray(x.topics)?x.topics.slice(0,5).map(String):undefined,url:h.url,src:h.src,k:o.k})})}
  catch(e){chunk.filter(h=>KW_OK.test(h.title+' '+h.desc)).forEach(h=>out.push({t:h.title,u:'',c:'',lvl:o.lvl||'',f:o.field||'',fund:'',dl:'',url:h.url,src:h.src,k:o.k}))}}
 return out}
let scanning=false;
async function prospect(o,log){if(scanning){log('Une prospection est déjà en cours.');return[]}scanning=true;const raw=[],known=new Set(CAT.map(x=>x.url).concat(S.found.map(x=>x.url)));
 try{const m=await getMcp();if(!m){log('Le connecteur Firecrawl n\'est pas disponible dans cette vue. Ouvrez la page dans Claude et autorisez Firecrawl.');return[]}
 for(const id of o.plats){const pl=PLATFORMS.find(p=>p.id===id);if(!pl)continue;const q=buildQuery(o,pl);log(pl.n+' · recherche');
  try{const h=await fcSearch(q,o.fresh);let n=0;h.forEach(x=>{if(!known.has(x.url)){known.add(x.url);raw.push({...x,src:pl.n});n++}});log(pl.n+' · '+h.length+' résultat(s), '+n+' nouveau(x)')}
  catch(e){log(pl.n+' · échec : '+(e&&e.code==='not_granted'?'accès au connecteur refusé':(e&&(e.message||e.code))||'erreur'));if(e&&e.code==='not_granted')break}}
 if(!raw.length){log('Aucun nouveau résultat.');S.scans.unshift({t:Date.now(),n:0});S.scans=S.scans.slice(0,20);save();return[]}
 log('Tri et extraction des offres ('+raw.length+' résultats)…');
 const offers=(await normalize(raw,o)).map(x=>({...x,id:'f'+uid(),found:today()}));
 S.found=offers.concat(S.found).slice(0,450);rebuildCat();S.scans.unshift({t:Date.now(),n:offers.length,q:o});S.scans=S.scans.slice(0,20);save();
 log('Terminé : '+offers.length+' offre(s) ajoutée(s) au catalogue.');return offers}
 finally{scanning=false}}

 {name:'ajouter_tache',description:'Ajoute une tâche à la feuille de route. etape: 0 Où postuler,1 Anglais,2 Documents,3 Candidature,4 Visa.',inputSchema:{type:'object',properties:{titre:{type:'string'},etape:{type:'integer'},date:{type:'string',description:'AAAA-MM-JJ'}},required:['titre','etape']},execute:({titre,etape,date})=>{S.roadmap.push({id:uid(),stage:Math.max(0,Math.min(4,etape|0)),title:titre,due:/^\d{4}-\d\d-\d\d$/.test(date||'')?date:addDays(7),done:false,custom:true});note('Tâche ajoutée : '+titre);save();return{ok:true}}},
 {name:'terminer_tache',description:'Marque une tâche de la feuille de route comme faite (par id).',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id']},execute:({id})=>{const t=S.roadmap.find(x=>x.id===id);if(!t)throw new Error('tâche inconnue');t.done=true;note('Tâche terminée : '+t.title);save();return{ok:true}}},
 {name:'enregistrer_document',description:'Enregistre un texte rédigé dans Documents.',inputSchema:{type:'object',properties:{titre:{type:'string'},dossier:{type:'string',enum:FOLDERS},texte:{type:'string'}},required:['titre','texte']},execute:({titre,dossier,texte})=>{S.docs.unshift({id:uid(),folder:FOLDERS.includes(dossier)?dossier:'Autres',title:titre,body:texte,t:Date.now(),ref:cur&&cur.scope||null});logEv('draft');note('Document enregistré : '+titre);save();return{ok:true}}},
 {name:'prospecter',description:'Lance une prospection en direct sur les plateformes (FindAPhD, EURAXESS, Academic Positions, LinkedIn, X, ScholarshipDb, Mastersportal, sites universitaires…) et ajoute les nouvelles offres au catalogue. Renvoie les offres trouvées avec leurs id.',inputSchema:{type:'object',properties:{type:{type:'string',enum:['position','scholarship','professor']},domaine:{type:'string'},niveau:{type:'string',enum:['Licence','Master','PhD','Postdoc']},pays:{type:'array',items:{type:'string'}},motscles:{type:'string'}},required:['type']},execute:async a=>{note('Prospection en cours…');const r=await prospect({k:a.type,field:a.domaine||S.profile.field,lvl:a.niveau||S.profile.level,countries:a.pays||S.profile.countries,kw:a.motscles||'',fresh:'qdr:m',plats:PLATFORMS.filter(p=>p.on&&p.k.includes(a.type)).map(p=>p.id)},m=>note(m));return{nouvelles:r.length,offres:r.slice(0,15).map(o=>({id:o.id,t:o.t,u:o.u,c:o.c,dl:o.dl,source:o.src}))}}},
 {name:'creer_alerte',description:'Crée une alerte d\'opportunités (après accord de l\'utilisateur).',inputSchema:{type:'object',properties:{texte:{type:'string'}},required:['texte']},execute:({texte})=>{if(S.alerts.length>=PLANS[S.plan].alerts)throw new Error('limite d\'alertes du plan atteinte');S.alerts.push({id:uid(),text:texte,f:'Hebdomadaire',t:Date.now()});note('Alerte créée');save();return{ok:true}}}];
function note(t){if(cur){cur.msgs.push({r:'act',c:t});paintMsgs()}}
function newChat(scope){cur={id:uid(),title:'Nouvelle conversation',pinned:false,t:Date.now(),msgs:[],scope:scope||null};return cur}
const TWT=[['Où postuler','Propose-moi une liste de 6 cibles (universités, programmes ou professeurs) adaptées à mon profil, avec pourquoi.'],['Vérifier l\'éligibilité','Pour les opportunités de mon tracker, dis-moi lesquelles correspondent à mon profil et ce qui manque.'],['Rédiger un document','Aide-moi à rédiger ma lettre de motivation. Pose-moi d\'abord 3 questions.'],['Prospecter des offres','Lance une prospection des postes financés dans mon domaine et mes pays, puis présente-moi les 5 meilleures.'],['Trouver des professeurs','Prospecte des professeurs qui recrutent des doctorants sur mon sujet, puis classe-les.'],['Idées de recherche','Donne-moi 3 pistes de recherche actuelles dans mon domaine, avec une question de recherche chacune.'],['Planifier ma semaine','Planifie ma semaine à partir de ma feuille de route et de mes dates limites.'],['Simulation d\'entretien','Fais-moi passer un entretien d\'admission : une question à la fois, puis un retour sur ma réponse.'],['Mettre à jour ma feuille de route','Voici ce qui a changé : ']];
let chatQ='';
function twin(){if(!cur)newChat();const P=PLANS[S.plan],cr=credits(),max=Math.min(P.day,P.month);
 const list=S.chats.filter(c=>!chatQ||c.title.toLowerCase().includes(chatQ.toLowerCase())).sort((a,b)=>(b.pinned-a.pinned)||b.t-a.t);
 return `<div class="twin"><div class="chats"><button class="btn" data-act="newchat">${ICS.plus}Nouvelle conversation</button><input type="search" id="cq" placeholder="Rechercher" aria-label="Rechercher une conversation" value="${esc(chatQ)}" style="margin:8px 0">
 ${list.map(c=>`<div class="it ${cur&&cur.id===c.id?'on':''}"><button class="t" data-chat="${c.id}">${esc(c.title)}</button><button class="btn ghost sm icon" data-cpin="${c.id}" aria-label="${c.pinned?'Désépingler':'Épingler'}"><span class="${c.pinned?'saved':''}">${ICS.star}</span></button><button class="btn ghost sm icon" data-cdel="${c.id}" aria-label="Supprimer">${ICS.x}</button></div>`).join('')||'<p class="tiny mut">Aucune conversation.</p>'}</div>
 <div class="conv"><div class="msgs" id="msgs"></div>
 <form class="composer" id="cf"><textarea id="ci" placeholder="Demander au Twin" aria-label="Message"></textarea>
 <div class="row"><label class="btn ghost sm fileb" title="Fichiers texte, CSV, Markdown ou JSON">${ICS.clip}<span id="fcount">Joindre</span><input type="file" id="cfile" multiple accept=".txt,.csv,.md,.json"></label>
 <label class="chip" style="border:0">Réflexion <select id="think" style="height:32px;padding:0 8px;width:auto;font-size:13px">${THINK.map((t,i)=>`<option value="${i}" ${S.think===i?'selected':''} ${i>P.think?'disabled':''}>${t}${i>P.think?' (Pro)':''}</option>`).join('')}</select></label>
 <span class="chip" title="Crédits Twin restants aujourd'hui"><span class="gauge"><i style="width:${Math.min(100,cr/(max>100?800:max)*100)}%"></i></span><span class="meta">${cr} crédits</span></span><span class="sp"></span>
 <button type="button" class="btn sm" id="cstop" ${busy?'':'hidden'}>Stop</button><button class="btn pri sm" ${busy?'disabled':''}>${ICS.send}Envoyer</button></div></form>
 <p class="note">Réponses issues de votre catalogue d'offres réelles et du modèle : vérifiez les exigences sur les pages officielles. Vous restez l'auteur de vos documents.</p></div></div>`}
function paintMsgs(){const m=$('#msgs');if(!m||!cur)return;
 if(!cur.msgs.length){m.innerHTML=`<h2>Que voulez-vous faire ?</h2><div class="tools">${TWT.map(([n,p],i)=>`<button class="tool" data-twt="${i}"><b>${n}</b><span class="tiny mut">${esc(p.slice(0,60))}…</span></button>`).join('')}</div>`;return}
 m.innerHTML=cur.msgs.map((x,i)=>`<div class="m ${x.r==='user'?'u':x.r==='act'?'act':'a'}" ${i===cur.msgs.length-1?'id="last"':''}></div>`).join('')+(cur.err?`<button class="btn sm" data-act="retry">Réessayer</button>`:'');
 [...m.children].forEach((el,i)=>{if(cur.msgs[i])el.textContent=cur.msgs[i].c});m.scrollTop=m.scrollHeight}
async function send(text,files){if(busy||!text.trim())return;
 if(!S.chats.includes(cur)){S.chats.unshift(cur)}
 let att='';for(const f of files||[]){if(f.size>10e6){toast(f.name+' dépasse 10 Mo');continue}try{att+=`\n[Fichier ${f.name}]\n`+(await f.text()).slice(0,20000)}catch(e){}}
 cur.msgs.push({r:'user',c:text+(att?`\n(${files.length} fichier(s) joint(s))`:'')});if(cur.title==='Nouvelle conversation')cur.title=text.slice(0,48);cur.t=Date.now();cur.err=false;
 cur.msgs.push({r:'assistant',c:'Réflexion…'});busy=true;paint();save();
 const hist=cur.msgs.filter(x=>x.r!=='act').slice(0,-1).slice(-16).map(x=>({role:x.r==='user'?'user':'assistant',content:x.c}));
 hist[0]={role:'user',content:ctx()+'\n\n'+hist[0].content};hist[hist.length-1].content+=att;
 abort=new AbortController();const slot=cur.msgs[cur.msgs.length-1],chat=cur;
 const r=await ask(hist,{signal:abort.signal,tools:TOOLS(),onText:t=>{slot.c=t;const l=$('#last');if(l&&chat===cur){l.textContent=t;$('#msgs').scrollTop=1e9}}});
 busy=false;if(r==null){if(slot.c==='Réflexion…'){chat.msgs.pop();chat.err=true}}else slot.c=r;
 if(/postul|appl/i.test(text)&&/j'ai|i have/i.test(text))chat.msgs.push({r:'act',c:'Avez-vous postulé ? Dites « oui, ajoute au tracker » pour l\'enregistrer comme Candidature envoyée.'});
 save();if(view==='twin')paint()}
function paint(){$('#main').innerHTML=twin();paintMsgs();bindTwin()}
function bindTwin(){const f=$('#cf');if(!f)return;const ci=$('#ci');
 f.onsubmit=e=>{e.preventDefault();const v=ci.value;const fl=[...$('#cfile').files].slice(0,5);ci.value='';send(v,fl)};
 ci.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}};
 $('#cfile').onchange=e=>{const n=e.target.files.length;$('#fcount').textContent=n?n+' fichier(s)':'Joindre'};$('#think').onchange=e=>{S.think=+e.target.value;save()};$('#cstop').onclick=()=>abort&&abort.abort();
 $('#cq').oninput=e=>{chatQ=e.target.value;const p=e.target.selectionStart;paint();const q=$('#cq');q.focus();q.setSelectionRange(p,p)}}

/* ---------- Routage & événements ---------- */
let view='home';
function render(){view=(location.hash||'#home').slice(1);if(!NAV.some(n=>n&&n[0]===view))view='home';side(view);
 if(view==='twin'){paint();return}
 const m=$('#main');m.innerHTML={home,roadmap,tracker,documents,alerts,plans,positions:()=>explore('position'),scholarships:()=>explore('scholarship'),professors:()=>explore('professor')}[view]();
 const fq=$('#fq');if(fq){const k={positions:'position',scholarships:'scholarship',professors:'professor'}[view];
  fq.oninput=e=>{F.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)};$('#fc').onchange=e=>{F.c=e.target.value;render()};$('#ff').onchange=e=>{F.f=e.target.value;render()};$('#fs').onchange=e=>{F.src=e.target.value;render()};$('#fp').onchange=e=>{F.past=e.target.checked;render()};const fl=$('#fl');if(fl)fl.onchange=e=>{F.l=e.target.value;render()}}
 const af=$('#af');if(af)af.onsubmit=e=>{e.preventDefault();const t=e.target.t.value.trim();if(!t)return;S.alerts.push({id:uid(),text:t,f:e.target.f.value,t:Date.now()});save();render();toast('Alerte créée')};
 document.querySelectorAll('[data-addtask]').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();const t=fm.t.value.trim();if(!t)return;S.roadmap.push({id:uid(),stage:+fm.dataset.addtask,title:t,due:/^\d{4}-\d\d-\d\d$/.test(fm.d.value)?fm.d.value:addDays(7),done:false,custom:true});save();render()})}
$('#side').addEventListener('click',e=>{const a=e.target.closest('a[href="#twin"]');if(a){cur=null;if(location.hash==='#twin')paint()}});
window.addEventListener('hashchange',()=>{closeAll();render();$('#main').focus({preventScroll:true});scrollTo(0,0)});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.tick){const x=S.roadmap.find(r=>r.id===d.tick);if(x){x.done=t.checked;save();setTimeout(render,250)}}
 if(d.st){const x=S.tracker.find(r=>r.id===d.st);if(x){x.status=t.value;if(/email/i.test(t.value))logEv('contact');save();toast('Statut : '+t.value)}}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;const d=b.dataset,[k,id]=(d.open||d.track||d.ask||d.elig||'').split(':');
 if(d.act==='close')closeAll();
 else if(d.act==='onboard')onboarding();
 else if(d.act==='newchat'){newChat();paint()}
 else if(d.act==='retry'&&cur){const u=[...cur.msgs].reverse().find(m=>m.r==='user');if(u){cur.msgs.splice(cur.msgs.lastIndexOf(u),1);send(u.c,[])}}
 else if(d.act==='mentor'||d.act==='delegate')modal(`<h2>${d.act==='mentor'?'Avis d\'un mentor':'Déléguer la candidature'}</h2><p class="mut">${d.act==='mentor'?'Décrivez votre besoin ; votre demande sera conservée ici pour être transmise à un mentor.':'Décrivez vos cibles et votre calendrier ; la demande est conservée ici.'}</p><form id="mf" class="grid"><textarea name="t" placeholder="Mon besoin…"></textarea><div class="row"><span class="sp"></span><button type="button" class="btn" data-act="close">Annuler</button><button class="btn pri">Enregistrer la demande</button></div></form><p class="note">Aucun service de mise en relation n'est branché dans cette version : rien n'est envoyé.</p>`),$('#mf').onsubmit=ev=>{ev.preventDefault();S.mentor.push({k:d.act,t:ev.target.t.value,at:Date.now()});save();closeAll();toast('Demande enregistrée')};
 else if(d.go)location.hash=d.go;
 else if(d.open)openItem(k,id);
 else if(d.track){track(k,id);if($('#drawer').classList.contains('on'))openItem(k,id);render()}
 else if(d.prospect)prospectModal(d.prospect);
 else if(d.analyze)analyze(d.analyze);
 else if(d.hide){S.hidden.push(d.hide);rebuildCat();save();closeAll();render();toast('Offre masquée')}
 else if(d.runalert){const a=S.alerts.find(x=>x.id===d.runalert);if(a)prospectModal('position',a.text)}
 else if(d.ask){const o=byId(id);newChat(id);location.hash='twin';if(view==='twin')paint();setTimeout(()=>send(`À propos de « ${o.t} » (${o.u}) : suis-je éligible et quels documents dois-je préparer ?`,[]),50)}
 else if(d.askt){newChat();if(location.hash==='#twin')paint();else location.hash='twin';setTimeout(()=>send(d.askt,[]),50)}
 else if(d.elig)eligibility(k,id);
 else if(d.done){const x=S.roadmap.find(r=>r.id===d.done);if(x){x.done=true;save();render();toast('Étape terminée')}}
 else if(d.deltask){S.roadmap=S.roadmap.filter(r=>r.id!==d.deltask);save();render()}
 else if(d.gen)gen(d.gen);
 else if(d.dopen)docOpen(d.dopen);
 else if(d.df){DV.f=d.df;render()}
 else if(d.tv){const [a,v]=d.tv.split(':');TV[a]=v;render()}
 else if(d.tsel)trackPanel(d.tsel);
 else if(d.untrack){S.tracker=S.tracker.filter(x=>x.id!==d.untrack);save();closeAll();render()}
 else if(d.pin){const x=S.tracker.find(r=>r.id===d.pin);if(x){if(!x.pinned&&S.tracker.filter(r=>r.pinned).length>=5){toast('5 éléments épinglés au maximum');return}x.pinned=!x.pinned;save();render()}}
 else if(d.delalert){S.alerts=S.alerts.filter(a=>a.id!==d.delalert);save();render()}
 else if(d.plan){S.plan=d.plan;if(S.think>PLANS[d.plan].think)S.think=PLANS[d.plan].think;save();render();toast('Plan '+PLANS[d.plan].n+' activé')}
 else if(d.chat){const c=S.chats.find(x=>x.id===d.chat);if(c){cur=c;closeAll();if(location.hash==='#twin')paint();else{location.hash='twin'}}}
 else if(d.cpin){const c=S.chats.find(x=>x.id===d.cpin);if(c){c.pinned=!c.pinned;save();paint()}}
 else if(d.cdel){S.chats=S.chats.filter(x=>x.id!==d.cdel);if(cur&&cur.id===d.cdel)newChat();save();paint()}
 else if(d.twt){const p=TWT[+d.twt][1];if(p.endsWith(': ')){const ci=$('#ci');ci.value=p;ci.focus()}else send(p,[])}});
render();
fetch('data/offres.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{SEED=Array.isArray(j)?j:[];rebuildCat();render()}).catch(()=>toast('Catalogue indisponible, réessayez plus tard'));
fetch('data/meta.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{META=j;render()}).catch(()=>{});

/* ---------- Persistance (compte) ---------- */
(async()=>{try{db=await claude.use('db');const u=await claude.use('user');myId=u&&await u.id();if(!db||!myId){db=null;return}
 const base='data/users/'+myId;const [c,ch,dc,fd]=await Promise.all([db.doc(base+'/core').get(),db.doc(base+'/chats').get(),db.doc(base+'/docs').get(),db.doc(base+'/found').get()]);
 if(c.exists&&(c.data().upd||0)>S.upd){S=Object.assign(blank(),JSON.parse(JSON.stringify(c.data())));S.chats=ch.exists?JSON.parse(JSON.stringify(ch.data().list||[])):[];S.docs=dc.exists?JSON.parse(JSON.stringify(dc.data().list||[])):[];S.found=fd.exists?JSON.parse(JSON.stringify(fd.data().list||[])):[];rebuildCat();try{localStorage.setItem('boussole',JSON.stringify(S))}catch(e){}cur=null;render()}
 else if(S.upd)flush()}catch(e){db=null}})();
}
</script>
</body>
</html>
